name: build-containers

on:
  push:
    branches: ['main']
    tags:
      - 'v*'
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      docker_image: ${{ steps.prepare.outputs.docker_image }}
      version: ${{ steps.prepare.outputs.version }}

    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      IMAGE_NAME: errcode-backend
      PLATFORMS: linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare 🔰
        id: prepare
        run: |
          echo "docker_image=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT

          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          [ "$VERSION" == "main" ] && VERSION=latest
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          echo "buildx_args=--platform ${{ env.PLATFORMS }} \
            --build-arg VERSION=${VERSION} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${VERSION} ." >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx 📐
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }} 🔍
        if: success() && !contains(github.event_name, 'pull_request')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Push 📌
        run: docker buildx build --output "type=image,push=${{ !contains(github.event_name, 'pull_request') }}" ${{ steps.prepare.outputs.buildx_args }}

  deploy:
    name: deploy (${{ matrix.display_name }})
    runs-on: self-hosted
    needs: [build]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - error_code: 403
            port: 9403
            display_name: Maintenance
          - error_code: 503
            port: 9503
            display_name: 502 Bad Gateway (HTTP 503)

    env:
      IMAGE_OWNER: ${{ github.repository_owner }}
      CONTAINER_NAME: error-page-${{ matrix.error_code }}

    steps:
      - name: Create GitHub Release 🎉
        if: startsWith(github.ref, 'refs/tags/') && matrix.error_code == 503
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## What's Changed

            🐳 **Docker Image:**
            - `${{ needs.build.outputs.docker_image }}:${{ needs.build.outputs.version }}`

            Built from commit: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start new container
        run: |
          container rm -f ${{ env.CONTAINER_NAME }} || true
          container run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --cpus 1 --memory 256M \
            -e ERROR_CODE=${{ matrix.error_code }} \
            -p ${{ matrix.port }}:8080 \
            ${{ needs.build.outputs.docker_image }}:${{ needs.build.outputs.version }}

  notify:
    name: Discord deployment alert
    runs-on: ubuntu-24.04
    needs: [build, deploy]
    if: always() && github.event_name != 'pull_request'

    steps:
      - name: Send one rollout alert
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DOCKER_IMAGE: ${{ needs.build.outputs.docker_image }}
          VERSION: ${{ needs.build.outputs.version }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            printf -v message 'Maintenance (HTTP 403, port 9403) and 502 Bad Gateway (HTTP 503, port 9503) successfully rolled out image `%s:%s`.' "$DOCKER_IMAGE" "$VERSION"
          else
            printf -v message 'Rollout failed (build: %s, deploy: %s).\nCheck: <%s>' "$BUILD_RESULT" "$DEPLOY_RESULT" "$RUN_URL"
          fi

          payload=$(jq -n --arg content "$message" '{content: $content}')
          curl --fail-with-body --silent --show-error \
            -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$payload"
