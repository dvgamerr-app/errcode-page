<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<base href="/" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			(() => {
				let theme;
				try {
					theme = localStorage.getItem('errcode-page-theme');
				} catch {
					theme = null;
				}

				if (theme !== 'light' && theme !== 'dark') {
					theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}

				document.documentElement.dataset.theme = theme;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			const configuredErrorCode = '[[placeholder `http.vars.error_code`]]';
			if (/^\d{3}$/.test(configuredErrorCode)) {
				const statusPages = {
					403: {
						label: 'Maintenance',
						variant: 'maintenance',
						ariaLabel: 'Service under maintenance',
						documentTitle: 'Maintenance · dvgamerr.app',
						metaTitle: 'Service under maintenance',
						description:
							'This service is temporarily unavailable while an update is being deployed.',
						heading: 'Maintenance in Progress.'
					},
					502: {
						label: '502',
						variant: 'error',
						ariaLabel: 'Error code 502',
						documentTitle: '502 Bad Gateway · dvgamerr.app',
						metaTitle: '502 Bad Gateway',
						description:
							'The upstream service is temporarily unavailable. Please try again shortly.',
						heading: '502 Bad Gateway'
					},
					503: {
						label: '502',
						variant: 'error',
						ariaLabel: 'Error code 502',
						documentTitle: '502 Bad Gateway · dvgamerr.app',
						metaTitle: '502 Bad Gateway',
						description:
							'The upstream service is temporarily unavailable. Please try again shortly.',
						heading: '502 Bad Gateway'
					}
				};
				const statusPage = statusPages[configuredErrorCode] ?? {
					label: configuredErrorCode,
					variant: 'error',
					ariaLabel: `Error code ${configuredErrorCode}`,
					documentTitle: `${configuredErrorCode} · dvgamerr.app`,
					metaTitle: `HTTP ${configuredErrorCode}`,
					description: 'The requested service is temporarily unavailable.',
					heading: `HTTP ${configuredErrorCode}`
				};

				const errorCodeElement = document.querySelector('[data-error-code]');
				if (errorCodeElement) {
					errorCodeElement.textContent = statusPage.label;
					errorCodeElement.dataset.code = statusPage.label;
					errorCodeElement.dataset.variant = statusPage.variant;
					errorCodeElement.setAttribute('aria-label', statusPage.ariaLabel);
				}

				document.title = statusPage.documentTitle;
				document.querySelector('meta[name="title"]')?.setAttribute('content', statusPage.metaTitle);
				document
					.querySelector('meta[name="description"]')
					?.setAttribute('content', statusPage.description);

				const statusTitleElement = document.querySelector('[data-status-title]');
				if (statusTitleElement) statusTitleElement.textContent = statusPage.heading;

				const statusDescriptionElement = document.querySelector('[data-status-description]');
				if (statusDescriptionElement) statusDescriptionElement.textContent = statusPage.description;
			}

			const yearElement = document.querySelector('[data-current-year]');
			if (yearElement) yearElement.textContent = String(new Date().getFullYear());

			const themeToggle = document.querySelector('[data-theme-toggle]');
			const rootElement = document.documentElement;

			function updateThemeToggle() {
				if (!themeToggle) return;
				const darkModeEnabled = rootElement.dataset.theme === 'dark';
				const label = darkModeEnabled ? 'Switch to light mode' : 'Switch to dark mode';
				themeToggle.setAttribute('aria-label', label);
				themeToggle.setAttribute('title', label);
				themeToggle.setAttribute('aria-pressed', String(darkModeEnabled));
			}

			if (themeToggle) {
				updateThemeToggle();
				themeToggle.addEventListener('click', () => {
					const nextTheme = rootElement.dataset.theme === 'dark' ? 'light' : 'dark';
					rootElement.dataset.theme = nextTheme;
					try {
						localStorage.setItem('errcode-page-theme', nextTheme);
					} catch {
						// The selected theme still applies for the current page.
					}
					updateThemeToggle();
				});
			}
		</script>
	</body>
</html>
