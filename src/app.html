<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<base href="/" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
			html[data-status-pending] body {
				visibility: hidden;
			}
		</style>
		<script>
			(() => {
				let theme;
				try {
					theme = localStorage.getItem('errcode-page-theme');
				} catch {
					theme = null;
				}

				if (theme !== 'light' && theme !== 'dark') {
					theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}

				document.documentElement.dataset.theme = theme;
				document.documentElement.setAttribute('data-status-pending', '');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(() => {
				const rootElement = document.documentElement;

				try {
					const configuredErrorCode = '[[placeholder `http.vars.error_code`]]';

					if (/^[1-5]\d{2}$/.test(configuredErrorCode)) {
						const statusEntry =
							document.querySelector(`[data-status-entry="${configuredErrorCode}"]`) ??
							document.querySelector(`[data-status-family="${configuredErrorCode[0]}"]`);

						if (statusEntry instanceof HTMLElement) {
							const title = statusEntry.dataset.statusTitle;
							const description = statusEntry.dataset.statusDescription;
							const category = statusEntry.dataset.statusCategory;
							const action = statusEntry.dataset.statusAction;
							const tone = statusEntry.dataset.statusTone;
							const glyph = statusEntry.dataset.statusGlyph;
							const family = statusEntry.dataset.statusFamilyValue;

							const statusRoot = document.querySelector('[data-status-root]');
							if (statusRoot instanceof HTMLElement) {
								if (tone) statusRoot.dataset.tone = tone;
								if (family) statusRoot.dataset.family = family;
							}

							const errorCodeElement = document.querySelector('[data-error-code]');
							if (errorCodeElement) {
								errorCodeElement.textContent = configuredErrorCode;
								errorCodeElement.dataset.code = configuredErrorCode;
							}

							const codePanelElement = document.querySelector('[data-code-panel]');
							codePanelElement?.setAttribute('aria-label', `HTTP status ${configuredErrorCode}`);

							const glyphElement = document.querySelector('[data-status-glyph]');
							if (glyphElement && glyph) glyphElement.textContent = glyph;

							const categoryElement = document.querySelector('[data-status-category]');
							if (categoryElement && category) categoryElement.textContent = category;

							const actionElement = document.querySelector('[data-status-action]');
							if (actionElement && action) actionElement.textContent = action;

							if (title) {
								document.title = `${configuredErrorCode} ${title} · dvgamerr.app`;
								document
									.querySelector('meta[name="title"]')
									?.setAttribute('content', `${configuredErrorCode} ${title}`);

								const statusTitleElement = document.querySelector('[data-status-title]');
								if (statusTitleElement) statusTitleElement.textContent = title;
							}

							if (description) {
								document
									.querySelector('meta[name="description"]')
									?.setAttribute('content', description);

								const statusDescriptionElement = document.querySelector(
									'[data-status-description]'
								);
								if (statusDescriptionElement) statusDescriptionElement.textContent = description;
							}
						}
					}
				} finally {
					rootElement.removeAttribute('data-status-pending');
				}

				const yearElement = document.querySelector('[data-current-year]');
				if (yearElement) yearElement.textContent = String(new Date().getFullYear());

				let themeTransitionRunning = false;
				let previousTouch;
				let ignoreDoubleClickUntil = 0;

				function applyNextTheme() {
					const nextTheme = rootElement.dataset.theme === 'dark' ? 'light' : 'dark';
					rootElement.dataset.theme = nextTheme;

					try {
						localStorage.setItem('errcode-page-theme', nextTheme);
					} catch {
						// The selected theme still applies for the current page.
					}
				}

				async function revealNextTheme(x, y) {
					if (themeTransitionRunning) return;

					const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
					if (!document.startViewTransition || reduceMotion) {
						applyNextTheme();
						return;
					}

					themeTransitionRunning = true;
					rootElement.classList.add('theme-transitioning');

					try {
						const transition = document.startViewTransition(applyNextTheme);
						await transition.ready;

						const radius = Math.hypot(
							Math.max(x, window.innerWidth - x),
							Math.max(y, window.innerHeight - y)
						);

						const reveal = rootElement.animate(
							{
								clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${radius}px at ${x}px ${y}px)`]
							},
							{
								duration: 650,
								easing: 'cubic-bezier(0.76, 0, 0.24, 1)',
								pseudoElement: '::view-transition-new(root)'
							}
						);

						await reveal.finished;
						await transition.finished;
					} finally {
						rootElement.classList.remove('theme-transitioning');
						themeTransitionRunning = false;
					}
				}

				document.addEventListener('dblclick', (event) => {
					if (Date.now() < ignoreDoubleClickUntil) return;
					event.preventDefault();
					revealNextTheme(event.clientX, event.clientY);
				});

				document.addEventListener(
					'pointerup',
					(event) => {
						if (event.pointerType !== 'touch') return;

						const currentTouch = {
							time: Date.now(),
							x: event.clientX,
							y: event.clientY
						};

						if (
							previousTouch &&
							currentTouch.time - previousTouch.time <= 350 &&
							Math.hypot(currentTouch.x - previousTouch.x, currentTouch.y - previousTouch.y) <= 48
						) {
							previousTouch = undefined;
							ignoreDoubleClickUntil = currentTouch.time + 700;
							revealNextTheme(currentTouch.x, currentTouch.y);
							return;
						}

						previousTouch = currentTouch;
					},
					{ passive: true }
				);
			})();
		</script>
	</body>
</html>
